<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F4EF" />
    <meta
      name="description"
      content="心屿是一个情绪日记与自我关怀产品。30 秒记录情绪，看见反复出现的触发因素，获得此刻就能做的自我关怀。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232E5A4C'/%3E%3Cpath d='M6 19c3.2 0 3.2-4 6.4-4s3.2 4 6.4 4 3.2-4 6.4-4' stroke='%23F3F4EF' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>心屿 · 情绪日记与自我关怀</title>
    <script>
      try {
        var t = localStorage.getItem('mindisle.theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
